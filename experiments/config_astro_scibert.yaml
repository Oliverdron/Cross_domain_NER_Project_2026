experiment_name: astro_scibert
output_dir: runs/
data_dir: data
seeds: [42, 123, 456]

model_name: allenai/scibert_scivocab_cased
tokenizer_name: allenai/scibert_scivocab_cased

max_seq_len: 512
batch_size: 32
learning_rate: 5.0e-5
weight_decay: 0.01
warmup_ratio: 0.1
num_epochs: 300
block_size: 1
early_stopping_patience: 8

# Cumulative target example counts per iteration. Iter k uses schedule[k]
# target paragraphs from the seed-shuffled injection pool. Length defines
# total iterations.
schedule: [0, 5, 7, 10, 15, 20, 25, 35, 50, 70, 95, 130, 180, 250, 350, 490, 675, 935, 1300, 1800]

source:
  name: ewt
  train: data/universal_train.iob2
  dev:   data/universal_dev.iob2
  unit:  sentence

target:
  name: astro
  train: data/astro_train.iob2
  dev:   data/astro_dev.iob2
  test:  data/astro_test.iob2
  unit:  paragraph

# EWT test (universal_test_masked.iob2) has masked gold tags → use ewt_dev as
# the source-forgetting probe.
eval_sets:
  ewt_dev:    data/universal_dev.iob2
  conll_test: data/news_test.iob2
  astro_test: data/astro_test.iob2
