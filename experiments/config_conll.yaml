# Iterative cross-domain NER experiment — target = CoNLL-2003 (news)
#
# Source = EWT (full universal_train.iob2). Each iteration k uses
# schedule[k] target sentences from a seed-shuffled injection pool.
# Model is re-initialised from the pretrained checkpoint at every iteration.
#
# Schedule unit: 1 sentence (matches target.unit). Note that 1 astro paragraph
# ≈ 5 EWT sentences ≈ 1 unit (handled in analysis, not auto-converted).

experiment_name: iter_conll
output_dir: runs/
data_dir: data
seeds: [42, 123, 456]

model_name: google-bert/bert-base-cased
tokenizer_name: google-bert/bert-base-cased

max_seq_len: 512
batch_size: 32
learning_rate: 5.0e-5
weight_decay: 0.01
warmup_ratio: 0.1
num_epochs: 300
block_size: 30
early_stopping_patience: 8

# Cumulative target example counts per iteration. Iter k uses schedule[k]
# target sentences from the seed-shuffled injection pool. Length defines
# total iterations.
schedule: [0, 150, 200, 250, 320, 410, 530, 680, 875, 1125, 1450, 1875, 2400, 3100, 4000, 5100, 6600, 8500, 10900, 14000]

source:
  name: ewt
  train: data/universal_train.iob2
  dev:   data/universal_dev.iob2
  unit:  sentence

target:
  name: conll
  train: data/news_train.iob2
  dev:   data/news_dev.iob2
  test:  data/news_test.iob2
  unit:  sentence

# EWT test (universal_test_masked.iob2) has masked gold tags → use ewt_dev as
# the source-forgetting probe.
eval_sets:
  ewt_dev:    data/universal_dev.iob2
  conll_test: data/news_test.iob2
  astro_test: data/astro_test.iob2
