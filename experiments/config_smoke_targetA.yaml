# Smoke-test config for target A (CoNLL). Uses a tiny random BERT for
# speed — purpose is to verify the pipeline / artifacts, not to learn
# anything. Source train is *not* subsampled here; runtime is dominated
# by source size.
experiment_name: smoke_targetA
output_dir: runs

seeds: [42]

model_name: hf-internal-testing/tiny-random-bert
tokenizer_name: hf-internal-testing/tiny-random-bert
max_seq_len: 128
batch_size: 64
learning_rate: 1.0e-3
num_epochs: 1
early_stopping_patience: 1
warmup_ratio: 0.1
weight_decay: 0.01

source:
  name: ewt
  train: data/universal_train.iob2
  dev:   data/universal_dev.iob2
  test:  data/universal_test_masked.iob2
  unit: sentence

target:
  name: conll
  train: data/news_train.iob2
  dev:   data/news_dev.iob2
  test:  data/news_test.iob2
  unit: sentence
  units_per_step: 2
  n_iterations: 2

eval_sets:
  source_test: data/universal_dev.iob2
  target_test: data/news_test.iob2
  other_target_test: data/astro_test.iob2
